<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Godot Game</title>

    <!-- Telegram WebApp script (required) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        /* The button is forced above the Godot canvas */
        #reward-ad-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2147483647; /* max possible */
            padding: 14px 22px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        #reward-ad-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Small on-screen status label so you can see what happens on mobile */
        #ad-status {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 2147483647;
            padding: 6px 10px;
            font-size: 12px;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            color: #00ff88;
            border-radius: 6px;
            max-width: 80vw;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- 1) Create the UI FIRST so it exists even if the SDK fails -->
    <button id="reward-ad-btn">Watch Ad for Reward</button>
    <div id="ad-status">initializing…</div>

    <!-- 2) Godot will inject its canvas here (the export adds it) -->
    <!--    Do not remove the Godot engine script tag that Godot added below -->

    <!-- 3) Load Adexium SDK AFTER the button exists -->
    <script src="https://cdn.adexium.tech/assets/js/tg-ads-co-widget.min.js"></script>

    <script>
    (function () {
        "use strict";

        var WIDGET_ID = "718ba235-5b3f-484a-9c4b-b21e0067ec8b"; // <-- CHANGE THIS
        var DEBUG     = true;                   // <-- CHANGE THIS to false for production

        var btn    = document.getElementById("reward-ad-btn");
        var status = document.getElementById("ad-status");
        var adexiumAds = null;
        var adReady = false;
        var isShowing = false;

        function log(msg) {
            console.log("[ADE][JS] " + msg);
            status.textContent = msg;
        }

        function setBtn(text, disabled) {
            btn.textContent = text;
            btn.disabled = !!disabled;
        }

        // --- Telegram readiness ---
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                log("Telegram WebApp ready");
            } else {
                log("Not inside Telegram (or telegram-web-app.js failed)");
            }
        } catch (e) {
            console.error(e);
        }

        // --- Adexium init ---
        if (typeof window.AdexiumWidget === "undefined") {
            log("Adexium SDK NOT loaded (blocked or wrong URL)");
            setBtn("SDK NOT LOADED", true);
            return;
        }

        try {
            adexiumAds = new window.AdexiumWidget({
                wid: WIDGET_ID,
                adFormat: "interstitial",
                debug: DEBUG
            });

            // Prefetch an ad so it's ready when the player clicks
            adexiumAds.requestAd("interstitial");
            log("SDK init OK — requesting ad…");
        } catch (e) {
            console.error(e);
            log("INIT ERROR: " + e.message);
            setBtn("INIT ERROR", true);
            return;
        }

        // --- Events ---
        adexiumAds.on("adReceived", function (ad) {
            adReady = true;
            setBtn("Watch Ad for Reward", false);
            log("Ad received ✅ (ready to show)");
        });

        adexiumAds.on("noAdFound", function () {
            adReady = false;
            setBtn("No ad available", false);
            log("No ad found (retry in a few seconds)");
            // Try again after 15s
            setTimeout(function () {
                try { adexiumAds.requestAd("interstitial"); } catch (e) {}
                setBtn("Watch Ad for Reward", false);
            }, 15000);
        });

        adexiumAds.on("adClosed", function () {
            isShowing = false;
            setBtn("Watch Ad for Reward", false);
            log("Ad closed — GRANT REWARD HERE 🎁");
            // === PUT YOUR REWARD LOGIC HERE ===
            // Example: call a Godot function via JavaScriptBridge
            // window.rewardPlayer && window.rewardPlayer();

            // Prefetch the next ad
            setTimeout(function () {
                try { adexiumAds.requestAd("interstitial"); } catch (e) {}
            }, 1000);
        });

        // --- Button click ---
        btn.addEventListener("click", function () {
            if (isShowing) return;
            if (!adReady) {
                log("No ad ready yet — requesting…");
                try { adexiumAds.requestAd("interstitial"); } catch (e) {}
                return;
            }
            isShowing = true;
            setBtn("Showing ad…", true);
            try {
                adexiumAds.displayAd();
            } catch (e) {
                console.error(e);
                isShowing = false;
                setBtn("Watch Ad for Reward", false);
                log("DISPLAY ERROR: " + e.message);
            }
        });

        // Enable the button
        setBtn("Watch Ad for Reward", false);
        log("Button ready — click to test");
    })();
    </script>

    <!-- ⚠️ IMPORTANT: Godot's own engine <script> tag goes BELOW this comment. -->
    <!-- When you export, Godot appends its startup script here. -->
    <!-- Make sure you keep Godot's script tag in the file. -->

</body>
</html>
